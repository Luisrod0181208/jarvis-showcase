<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="560" fill="#fafbfc"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2530">JARVIS — Distributed Architecture</text>

  <!-- Mesh boundary -->
  <rect x="24" y="52" width="812" height="400" rx="16" fill="none" stroke="#8a7bd8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="44" y="76" font-size="12.5" fill="#6b5cc4" font-weight="bold">Encrypted mesh VPN (WireGuard) — zero forwarded ports, no public exposure</text>

  <!-- Pi -->
  <rect x="48" y="94" width="330" height="330" rx="12" fill="#eef6f4" stroke="#3a9188" stroke-width="1.4"/>
  <text x="213" y="118" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#25655f">Raspberry Pi 5 — operational core</text>

  <rect x="66" y="132" width="294" height="40" rx="7" fill="#fff4e0" stroke="#c98a2b" stroke-width="1.2"/>
  <text x="213" y="151" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5416">Voice service (always-on)</text>
  <text x="213" y="165" text-anchor="middle" font-size="10.5" fill="#7a5416">wake word · VAD · dispatch · TTS</text>

  <rect x="66" y="182" width="141" height="34" rx="6" fill="#ffffff" stroke="#9aa4b0" stroke-width="1"/>
  <text x="136" y="202" text-anchor="middle" font-size="11" fill="#39414c">Pre-router (&lt;50 ms)</text>
  <rect x="219" y="182" width="141" height="34" rx="6" fill="#ffffff" stroke="#9aa4b0" stroke-width="1"/>
  <text x="289" y="202" text-anchor="middle" font-size="11" fill="#39414c">LLM router (3-tier)</text>

  <rect x="66" y="228" width="294" height="118" rx="8" fill="#e8f0fb" stroke="#4a7cc0" stroke-width="1.2"/>
  <text x="213" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5286">Docker stack (~16 containers)</text>
  <text x="213" y="268" text-anchor="middle" font-size="10.5" fill="#39516f">Home Assistant · Pi-hole · ntfy · Immich</text>
  <text x="213" y="284" text-anchor="middle" font-size="10.5" fill="#39516f">Jellyfin · Nginx Proxy Manager · Uptime Kuma</text>
  <text x="213" y="300" text-anchor="middle" font-size="10.5" fill="#39516f">MQTT · dashboards · watchdog + autoheal</text>
  <text x="213" y="322" text-anchor="middle" font-size="10.5" fill="#39516f" font-style="italic">Zigbee coordinator · BLE bridges</text>
  <text x="213" y="338" text-anchor="middle" font-size="10.5" fill="#39516f" font-style="italic">Snapcast audio server</text>

  <rect x="66" y="358" width="294" height="50" rx="8" fill="#f2f2f2" stroke="#9aa4b0" stroke-width="1"/>
  <text x="213" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#39414c">Smart home devices</text>
  <text x="213" y="395" text-anchor="middle" font-size="10" fill="#556070">lights · lock · thermostat · TV · EV · presence sensors</text>

  <!-- Mac Mini -->
  <rect x="452" y="94" width="356" height="180" rx="12" fill="#fdeeee" stroke="#c25b5b" stroke-width="1.4"/>
  <text x="630" y="118" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8f3535">Mac Mini M1 — inference server</text>

  <rect x="470" y="132" width="320" height="40" rx="7" fill="#fff4e0" stroke="#c98a2b" stroke-width="1.2"/>
  <text x="630" y="151" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5416">Ollama — local LLMs</text>
  <text x="630" y="165" text-anchor="middle" font-size="10.5" fill="#7a5416">8B function model (DEEP) · 3B chat model (FAST)</text>

  <rect x="470" y="182" width="153" height="36" rx="6" fill="#ffffff" stroke="#9aa4b0" stroke-width="1"/>
  <text x="546" y="200" text-anchor="middle" font-size="11" fill="#39414c">Whisper STT server</text>
  <text x="546" y="212" text-anchor="middle" font-size="9.5" fill="#6a7482">(GPU-class speed)</text>
  <rect x="637" y="182" width="153" height="36" rx="6" fill="#ffffff" stroke="#9aa4b0" stroke-width="1"/>
  <text x="713" y="200" text-anchor="middle" font-size="11" fill="#39414c">Satellite voice node</text>
  <text x="713" y="212" text-anchor="middle" font-size="9.5" fill="#6a7482">second-room microphone</text>

  <rect x="470" y="228" width="320" height="30" rx="6" fill="#ffffff" stroke="#9aa4b0" stroke-width="1"/>
  <text x="630" y="247" text-anchor="middle" font-size="11" fill="#39414c">Snapcast client — multi-room audio playback</text>

  <!-- MacBook -->
  <rect x="452" y="296" width="356" height="70" rx="12" fill="#eef6ea" stroke="#5f9440" stroke-width="1.4"/>
  <text x="630" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#3e6626">MacBook Air M4 — dev workstation</text>
  <text x="630" y="340" text-anchor="middle" font-size="10.5" fill="#4a5c3c">VS Code over SSHFS · manual review before anything ships</text>
  <text x="630" y="355" text-anchor="middle" font-size="10.5" fill="#4a5c3c">never runs production services</text>

  <!-- Cloud -->
  <rect x="452" y="384" width="356" height="52" rx="12" fill="#e8f0fb" stroke="#4a7cc0" stroke-width="1.4"/>
  <text x="630" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5286">Frontier model API (CLOUD tier)</text>
  <text x="630" y="424" text-anchor="middle" font-size="10.5" fill="#39516f">web search · tool use · typed escalations only — cost-capped</text>

  <!-- Flows -->
  <path d="M360 152 L468 152" fill="none" stroke="#c25b5b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="414" y="144" text-anchor="middle" font-size="9.5" fill="#8f3535">inference</text>

  <path d="M468 200 L360 200" fill="none" stroke="#3a9188" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="414" y="192" text-anchor="middle" font-size="9.5" fill="#25655f">STT / audio</text>

  <path d="M470 331 L410 331 L410 260 L362 260" fill="none" stroke="#5f9440" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="432" y="300" text-anchor="middle" font-size="9.5" fill="#3e6626">SSHFS</text>

  <path d="M289 218 L289 224 M420 410 L378 410 M289 218 C289 410 340 410 420 410" fill="none" stroke="#4a7cc0" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="352" y="430" text-anchor="middle" font-size="9.5" fill="#2b5286">escalation</text>

  <path d="M213 346 L213 356" fill="none" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="430" y="478" text-anchor="middle" font-size="11.5" fill="#556070">Voice path:  microphone → wake word → VAD → STT → pre-router → LLM tier → function dispatch → TTS → multi-room audio</text>
  <text x="430" y="500" text-anchor="middle" font-size="11.5" fill="#556070">Design principles:  local-first · suppress-not-drop · constrained decoding · the constraint is the feature</text>
  <text x="430" y="534" text-anchor="middle" font-size="10" fill="#8a94a2">Built on hardware already owned — no new purchases. Full source private by deliberate choice.</text>
</svg>
